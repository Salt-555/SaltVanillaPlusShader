schema = 1
id = "halo_look"
name = "Halo Look"
version = "0.16.47"
api = "0.2"
description = "Sun shadows from a shadow map, LabPBR surfaces, spectral water with absorption and foam, coloured block light, wind on leaves and plants, sun and moon shafts, aurora and lightning, ground fog, bloom, film grain, and an ACES filmic curve. Heavy sampling at half and quarter resolution. No ray tracing."
authors = ["Artemis"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Atmosphere"

[vertex]
file = "vertex.wgsl"
name = "Wind"

[material]
file = "material.wgsl"
name = "Surface light"
reads = ["wave_clock"]

[shadow]
resolution = 1024
distance = 64.0
option = "shadows"
resolution_option = "shadow_resolution"
distance_option = "shadow_distance"

[reflection]
option = "reflections"
# Quarter-res mirror: the planar draw is a full second world pass, and its fill
# cost falls with the square of the scale. The 2.4 ms GPU figure quoted on the
# reflections option is a half-res-era measurement at native 4K; the quarter-res
# pass has never been benched separately. The mirror is the pack's one big bill:
# the worst held scene measured a mirror toggle at -1.7 ms of frame.
scale = 0.25

# Sprite classes for the vertex stage's wind. Ids come to VertexInput.material;
# sprites that match nothing are 0 and move untouched. Names are atlas sprite
# paths, and a wrong name costs nothing: it just never matches, never waves.
[[materials]]
id = 1
sprites = ["block/*_leaves", "block/azalea_leaves*", "block/spore_blossom"]

[[materials]]
id = 2
sprites = ["block/short_grass", "block/fern", "block/large_fern_*",
           "block/tall_grass_*", "block/*_sapling", "block/dead_bush", "block/hanging_roots",
           "block/crimson_roots", "block/warped_roots", "block/poppy", "block/dandelion",
           "block/allium", "block/azure_bluet", "block/*_tulip", "block/tulips",
           "block/blue_orchid", "block/oxeye_daisy", "block/cornflower",
           "block/lily_of_the_valley", "block/wither_rose", "block/sunflower*",
           "block/lilac_*", "block/peony_*", "block/rose_bush_*", "block/torchflower*",
           "block/pitcher_plant*", "block/pitcher_crop_*", "block/sugar_cane",
           "block/stage_*", "block/seagrass*", "block/tall_seagrass_*", "block/kelp*", "block/red_mushroom",
           "block/brown_mushroom", "block/crimson_fungus", "block/warped_fungus"]

[[materials]]
id = 3
sprites = ["block/vine*", "block/*vines*", "block/twisting_vines*", "block/weeping_vines*"]

# Nether-hosted ores and debris FIRST, at an inert id: measured at the 0.16.39
# review, the chroma gate carries a mean weight of 0.45 on these faces and
# 0.35 on bare netherrack (overworld stone hosts sit at 0.00-0.01), so the
# host itself would light and the flecks would lose their contrast. Matte
# until a host-aware recipe exists.
[[materials]]
id = 9
sprites = ["block/nether_gold_ore", "block/nether_quartz_ore",
           "block/ancient_debris_side", "block/ancient_debris_top"]

# The glowing ore faces, named one by one — a glob would silently draft
# every modded or future *_ore sprite into the glow with no host check, the
# exact failure entry 9 exists to stop. Coal is not in the list (its flecks
# are achromatic; leaving it out is the cheap, permanent no). First match
# wins, so entry 9 above keeps the nether hosts regardless of this list.
# Sprite names verified against server resources assets/minecraft/textures/block.
[[materials]]
id = 8
sprites = ["block/copper_ore", "block/diamond_ore", "block/emerald_ore",
           "block/gold_ore", "block/iron_ore", "block/lapis_ore",
           "block/redstone_ore", "block/deepslate_copper_ore",
           "block/deepslate_diamond_ore", "block/deepslate_emerald_ore",
           "block/deepslate_gold_ore", "block/deepslate_iron_ore",
           "block/deepslate_lapis_ore", "block/deepslate_redstone_ore"]

[tonemap]
file = "tonemap.wgsl"
name = "Filmic curve"

[[resource]]
name = "rays_hist"
format = "rgba16float"
scale = 0.25
keep = "view"

[[resource]]
name = "wave_clock"
buffer = 116
element = "f32"
keep = "view"

# One dispatch a frame folds the spectrum's frame-constant sines and time products
# (22 transcendentals per water pixel at the fragment's expense) into a storage buffer
# that [material] reads; see pre/wave_clock.wgsl for the slot layout.
[[before_world]]
file = "pre/wave_clock.wgsl"
dispatch = [1, 1, 1]
workgroup = [1, 1, 1]
writes = ["wave_clock"]

[[post]]
file = "post/shade.wgsl"
name = "Shade (half res)"
output = "shade_buf"
scale = 0.5

# The shaft pair runs AHEAD of the bloom trio on purpose (0.16.42): the blur's
# vertical leg folds rays_hist into glow_blur at quarter res, so composite
# samples one merged additive field instead of two. Reordering these passes
# without moving the fold would read a stale (previous-frame) rays_hist.
[[post]]
file = "post/god_rays.wgsl"
name = "Sun shafts"
output = "god_halo"
scale = 0.25

# No `scale` on this entry by engine contract, not by oversight: an `output`
# naming a kept texture writes at that texture's own size (rays_hist declares
# scale 0.25 above) and the manifest refuses the pass if scale appears. The
# input.pixel <-> god_halo/rays_hist texel alignment in the file rests on the
# resource's scale, which is the only place it can be declared.
[[post]]
file = "post/rays_accum.wgsl"
name = "Shaft history"
output = "rays_hist"
reads = ["rays_hist_previous"]

[[post]]
file = "post/bloom_bright.wgsl"
name = "Bloom bright"
output = "glow_buf"
scale = 0.25

[[post]]
file = "post/bloom_blur.wgsl"
name = "Bloom blur H"
output = "glow_h"
scale = 0.25

[[post]]
file = "post/bloom_blur_v.wgsl"
name = "Bloom blur V"
output = "glow_blur"
reads = ["rays_hist"]
scale = 0.25

[[post]]
file = "post/composite.wgsl"
name = "Composite and grade"

[[options]]
id = "shadows"
name = "Sun shadows"
description = "A shadow map from the sun, the moon by night. Off skips the shadow pass whole, which is the pack's biggest saving."
type = "bool"
default = true

[[options]]
id = "shadow_resolution"
name = "Shadow resolution"
description = "Texels along the map's side. The terrain in the light's square is drawn again each frame, so this is a real cost."
type = "choice"
values = ["512", "1024", "2048", "4096"]
default = "1024"
resets = "view"

[[options]]
id = "shadow_distance"
name = "Shadow distance"
description = "Half the side of the ground the map covers, in blocks. Less ground drawn again, and a sharper shadow nearby."
type = "int"
default = 64
min = 32
max = 256
resets = "view"

[[options]]
id = "shadow_softness"
name = "Shadow softness"
description = "0 is the map's own 2x2 filter, one read. Above 0 adds three wider taps."
type = "float"
default = 0.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "contact_ao"
name = "Contact shading"
description = "Depth-based darkening where surfaces meet, at half resolution. 0 skips it."
type = "float"
default = 0.5
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "specular"
name = "Specular"
description = "The sun's and moon's highlight on smooth surfaces, and the glint on water."
type = "float"
default = 0.8
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "ore_glow"
name = "Ore glow"
description = "Named overworld ores carry a slight self-light in their own color, so a vein reads in the dark. It is a self-light: face orientation does not dim it. Only the saturated flecks brighten; the stone host stays stone. Coal and the nether ores stay matte by design. Diamond, gold and emerald flecks pass the bloom's brightness knee and gain a halo; the pale ones glow without one at the default. Cost is one integer compare and a few channel ops per ore texel."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "reflections"
name = "Water mirror"
description = "Water reflects the world about its plane. A second world draw at quarter resolution every frame, even where no water is in view; measured at the half-res scale in native-4K era: about 2.4 ms of GPU (gpu 4.3 to 6.7 ms, 19 Nov); quarter-res is cheaper by fill but never separately benched. Switch it off if you need the frames."
type = "bool"
default = true

[[options]]
id = "water_waves"
name = "Water waves"
description = "How much the water's surface moves, in its reflection and its glint."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "wave_bend"
name = "Wave bend"
description = "How far the wave crests wander from straight, in blocks. Higher breaks the parallel rows; 0 gives straight crests."
type = "float"
default = 4.0
min = 0.0
max = 6.0
step = 0.1

[[options]]
id = "water_murk"
name = "Water murk"
description = "How fast water absorbs light along the ray. Red goes first, so deep water turns blue-green on its own."
type = "float"
default = 1.0
min = 0.2
max = 2.5
step = 0.05

[[options]]
id = "water_foam"
name = "Foam"
description = "A shallow band at the shore and speckle on steep crests. 0 turns it off."
type = "float"
default = 0.6
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "refraction"
name = "Refraction"
description = "How much the wave slope bends what lies behind the water, scaled by depth."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "reflection_distort"
name = "Reflection wobble"
description = "How much the waves perturb the mirror, growing with distance to the water."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "colored_light"
name = "Coloured block light"
description = "Soul fire blue, redstone red, lava and torchlight warm. 0 skips the light grid read."
type = "float"
default = 0.85
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "bloom"
name = "Bloom"
description = "A soft halo around light above white, at quarter resolution. 0 zeroes the bright stage; the two blur legs then run on black."
type = "float"
default = 0.4
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "saturation"
name = "Saturation"
description = "Color intensity across the grade. Below 1 drains toward film gray."
type = "float"
default = 1.2
min = 0.0
max = 2.0
step = 0.02

[[options]]
id = "warmth"
name = "Warmth"
description = "Golden at a low sun, cool at night."
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "vignette"
name = "Vignette"
description = "Frame edges sink a little and run a hair cold: lens glass, not dirt on a screen."
type = "bool"
default = true

[[options]]
id = "edge_smooth"
name = "Edge smoothing"
description = "The pack's chain replaces Horizon's resolve, so TAA and FXAA do not run. This is a cheap edge-directed filter; 0 skips the filter's own edge reads."
type = "float"
default = 1.0
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "sky_haze"
name = "Sky haze"
description = "Warm scatter at the horizon and a deeper zenith."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "god_rays"
name = "Sun shafts"
description = "True volumetric march: four coverage probes per ray through the air, plus a history pass that folds about thirteen jittered frames into each cell. Measured in the ten-step era facing the sun: gpu 6.5 ms at quarter resolution; each probe now costs a third of the shadow-map loads it used to. 0 skips both passes' reads (the quarter-res passes still dispatch)."
type = "float"
default = 0.45
min = 0.0
max = 1.5
step = 0.05
resets = "view"

[[options]]
id = "wave_strength"
name = "Wind"
description = "Leaves and plants move. Pure vertex work: the cost is in the mesh's vertex shader, no texture reads, no lighting change."
type = "float"
default = 1.0
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "clarity"
name = "Clarity"
description = "Local contrast on edges only: crisp texture detail without crunch in flat areas. Four reads at the window's size."
type = "float"
default = 0.25
min = 0.0
max = 0.6
step = 0.05

[[options]]
id = "moon_shafts"
name = "Moon shafts"
description = "After sunset the march runs moonward: cold silver moon shafts at 0.55 of the sun's scatter, against the moon's own shadow map. 0 keeps night black."
type = "float"
default = 0.7
min = 0.0
max = 1.5
step = 0.05
resets = "view"

[[options]]
id = "moon_halo"
name = "Moon halo and airglow"
description = "The moon's glass-disc gleam, a wide soft lobe, and a faint green airglow line along the horizon on clear nights."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "night_grade"
name = "Night colour"
description = "Unlit ground tips teal under the moon while lamp-lit surfaces keep their warmth."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "ground_fog"
name = "Ground fog"
description = "Mist pools below the fog line and drapes across low ground, silvered where it faces the moon. Deepens at night."
type = "float"
default = 0.45
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "fog_line"
name = "Fog line"
description = "World height the mist fills up to, in blocks. Raise it to flood valleys, drop it to leave only the lakes."
type = "float"
default = 100.0
min = 40.0
max = 160.0
step = 1.0

[[options]]
id = "stars"
name = "Stars and galaxy"
description = "A field of steady stars and the galaxy's dust band on clear nights. Cheap: a handful of integer hashes on sky pixels."
type = "float"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "aurora"
name = "Aurora"
description = "Slow green-violet curtains low in the sky on clear nights, toward one compass way."
type = "float"
default = 0.8
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "storm"
name = "Lightning"
description = "Distant lightning in rain: the cloud shell brightens. Sky only, so caves, roofs and interiors stay dark through a storm. Silent when it is not raining."
type = "float"
default = 1.0
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "sparkle"
name = "Sun sparkle"
description = "Discrete facets on wave crests catching full sun at dawn and dusk. One hash on lit water."
type = "float"
default = 1.0
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "vanilla_flow"
name = "Vanilla Boil"
description = "Vanilla's own animated flow texture multiplied onto the composited water pixel, fading from a max near the eye to gone at 30 blocks. One 32px fetch; measured at ~0.03 ms."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "film_grain"
name = "Film grain"
description = "A touch of grain in the shadows, re-rolled at film cadence. The last tenth of a film look."
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[pages]]
id = "main"
name = "Halo Look"
items = ["page:light", "page:colour", "page:water", "page:world"]

[[pages]]
id = "light"
name = "Light and shadow"
description = "The sun's shadow, contact shading, sun shafts, specular and the ores' self-light. Shadow resolution and distance are the two that cost frames."
items = ["shadows", "shadow_resolution", "shadow_distance", "shadow_softness", "contact_ao", "god_rays", "moon_shafts", "specular", "ore_glow"]

[[pages]]
id = "colour"
name = "Colour"
description = "Bloom, grade, clarity, edges and the sky."
items = ["bloom", "saturation", "warmth", "clarity", "vignette", "film_grain", "edge_smooth", "sky_haze", "stars", "aurora", "moon_halo", "night_grade"]

[[pages]]
id = "world"
name = "Wind"
description = "The living world: the wind itself is pure vertex work; the fog and the storm's flash are screen effects."
items = ["wave_strength", "storm", "ground_fog", "fog_line"]

[[pages]]
id = "water"
name = "Water and lamps"
description = "Where the per-pixel work lives. The mirror is the pack's biggest single cost."
items = ["reflections", "water_waves", "wave_bend", "reflection_distort", "refraction", "water_murk", "water_foam", "sparkle", "vanilla_flow", "colored_light"]

[[lights]]
color = [0.30, 0.68, 1.00]
blocks = ["soul_torch", "soul_wall_torch", "soul_lantern", "soul_campfire", "soul_fire"]

[[lights]]
color = [1.00, 0.22, 0.12]
blocks = ["redstone_torch", "redstone_wall_torch", "redstone_lamp", "redstone_block", "redstone_wire"]

[[lights]]
color = [1.00, 0.52, 0.18]
blocks = ["lava", "fire", "campfire", "magma_block"]

[[lights]]
color = [1.00, 0.72, 0.42]
blocks = ["torch", "wall_torch", "lantern", "jack_o_lantern", "*_candle"]

[[lights]]
color = [1.00, 0.84, 0.58]
blocks = ["glowstone", "shroomlight", "*_froglight"]

[[lights]]
color = [0.62, 0.88, 1.00]
blocks = ["sea_lantern", "beacon", "end_rod", "conduit"]

[[lights]]
color = [0.78, 0.55, 1.00]
blocks = ["amethyst_cluster", "large_amethyst_bud", "crying_obsidian", "respawn_anchor"]

[[textures]]
id = "ripple_a"
file = "textures/ripple_a.png"

[[textures]]
id = "ripple_b"
file = "textures/ripple_b.png"

[budget]
gpu_ms = 0.8
